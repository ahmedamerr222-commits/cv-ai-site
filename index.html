<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="Ya1VaciR5pdWYhgZMnAOUdOBp29fMfkgaMlRRwtTpa8" />
    <meta name="description" content="CV AI - أنشئ سيرة ذاتية احترافية ومتوافقة مع أنظمة ATS باستخدام الذكاء الاصطناعي.">
    <meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV AI — النسخة الثانية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f8fc;color:#172033}
header{background:#fff;border-bottom:1px solid #e7eaf0;padding:16px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800;color:#3157d5}.badge{font-size:13px;background:#eef2ff;color:#3157d5;padding:8px 12px;border-radius:20px}
.hero{padding:55px 7%;text-align:center;background:linear-gradient(135deg,#eef2ff,#fff)}
.hero h1{font-size:40px;margin:0 0 12px}.hero p{color:#667085;font-size:18px}
.container{max-width:1100px;margin:35px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:18px;padding:25px;box-shadow:0 8px 30px #1720330b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}label{font-weight:700;display:block;margin-bottom:7px}
input,textarea{width:100%;padding:13px;border:1px solid #d9deea;border-radius:10px;font-size:15px}textarea{min-height:105px;resize:vertical}.full{grid-column:1/-1}
button{border:0;border-radius:11px;padding:13px 21px;font-size:15px;font-weight:700;cursor:pointer;background:#3157d5;color:#fff}.secondary{background:#eef2ff;color:#3157d5}.ai{background:#111827}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.status{display:none;margin-top:15px;padding:13px;border-radius:10px;background:#f0fdf4;color:#166534}
.preview{margin-top:25px;display:none}.cv{background:#fff;border:1px solid #ddd;max-width:820px;margin:auto;padding:40px;direction:ltr;text-align:left}
.cv h1{margin:0 0 5px;font-size:32px}.role{color:#3157d5;font-weight:700}.cv h3{border-bottom:1px solid #ddd;padding-bottom:7px;margin-top:25px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:30px}}
@media print{header,.hero,.container>.card:first-child,.preview h2,.preview .actions{display:none!important}.preview{display:block!important;margin:0}.cv{border:0}}
</style>
</head>
<body>
<header><div class="logo">CV AI</div><div class="badge">الإصدار التجريبي 2.0</div></header>

<section class="hero">
<h1>حوّل خبرتك إلى CV احترافي</h1>
<p>اكتب بياناتك، ثم استخدم زر تحسين AI للحصول على صياغة أقوى.</p>
</section>

<div class="container">
<div class="card">
<h2>بيانات الـCV</h2>
<div class="grid">
<div><label>الاسم</label><input id="name" placeholder="أحمد محمد"></div>
<div><label>الوظيفة المستهدفة</label><input id="role" placeholder="Accountant"></div>
<div><label>البريد الإلكتروني</label><input id="email" placeholder="example@email.com"></div>
<div><label>رقم الهاتف</label><input id="phone" placeholder="+20 ..."></div>
<div class="full"><label>الخبرة العملية</label><textarea id="experience" placeholder="مثال: عملت سنتين كمحاسب وكنت مسؤولًا عن الفواتير والتقارير وExcel"></textarea></div>
<div><label>التعليم</label><textarea id="education" placeholder="كلية التجارة — جامعة ..."></textarea></div>
<div><label>المهارات</label><textarea id="skills" placeholder="Excel, Accounting, ERP"></textarea></div>
<div><label>اللغات</label><textarea id="languages" placeholder="العربية — ممتاز&#10;الإنجليزية — جيد جدًا"></textarea></div>
<div class="full"><label>نبذة عنك</label><textarea id="summary" placeholder="اكتب عن نفسك بشكل بسيط"></textarea></div>
</div>

<div class="actions">
<button class="ai" onclick="improveAI()">✨ تحسين بالـAI</button>
<button onclick="generateCV()">إنشاء الـCV</button>
<button class="secondary" onclick="clearForm()">مسح</button>
</div>
<div class="status" id="status"></div>
</div>

<div class="preview card" id="preview">
<h2>معاينة الـCV</h2>
<div class="cv" id="cv"></div>
<div class="actions"><button onclick="window.print()">📄 طباعة / حفظ PDF</button></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const v=id=>$(id).value.trim();
let aiCV='';

const WORKER_URL = 'https://bold-cell-b95f.ahmedamerr222.workers.dev/';

async function improveAI(){
  if(!v('experience') && !v('summary')){
    showStatus('اكتب على الأقل خبرتك أو نبذة عنك أولًا.','error'); return;
  }
  showStatus('✨ جاري تحسين الـCV بالـAI...','loading');
  try{
    const payload={
      name:v('name'), role:v('role'), email:v('email'), phone:v('phone'),
      experience:v('experience'), education:v('education'), skills:v('skills'),
      languages:v('languages'), summary:v('summary')
    };
    const response=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const result=await response.json();
    if(!response.ok || !result.success || !result.cv){
      throw new Error(result.error ? JSON.stringify(result.error) : 'فشل الاتصال بخدمة AI');
    }
    const cvText=String(result.cv).trim();
    aiCV=cvText;
    showStatus('✅ تم تحسين الـCV بواسطة AI. اضغط «إنشاء الـCV» لرؤية النتيجة.','ok');
  }catch(error){
    console.error(error);
    showStatus('❌ حدث خطأ أثناء الاتصال بالـAI. تأكد من أن الـWorker يعمل ثم حاول مرة أخرى.','error');
  }
}

function generateCV(){
 const name=v('name')||'Your Name', role=v('role')||'Professional';
 const contact=[v('email'),v('phone')].filter(Boolean).join(' | ');
 if(aiCV){
   $('cv').innerHTML=`<h1>${escapeHTML(name)}</h1><div class="role">${escapeHTML(role)}</div><p>${escapeHTML(contact)}</p><div class="ai-text">${nl(aiCV)}</div>`;
 }else{
   $('cv').innerHTML=`
   <h1>${escapeHTML(name)}</h1><div class="role">${escapeHTML(role)}</div>
   <p>${escapeHTML(contact)}</p>
   <h3>PROFILE</h3><p>${nl(v('summary')||'Professional candidate seeking a new opportunity.')}</p>
   <h3>EXPERIENCE</h3><p>${nl(v('experience')||'Add your professional experience here.')}</p>
   <h3>EDUCATION</h3><p>${nl(v('education')||'Add your education here.')}</p>
   <h3>SKILLS</h3><p>${escapeHTML(v('skills')||'Add your skills here.').replace(/,/g,' • ')}</p>
   <h3>LANGUAGES</h3><p>${nl(v('languages')||'Add your languages here.')}</p>`;
 }
 $('preview').style.display='block';
 $('preview').scrollIntoView({behavior:'smooth'});
}
function nl(x){return escapeHTML(x).replace(/\n/g,'<br>')}
function escapeHTML(x){return x.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showStatus(text,type){$('status').style.display='block';$('status').textContent=text;$('status').style.background=type==='error'?'#fef2f2':type==='loading'?'#eff6ff':'#f0fdf4';$('status').style.color=type==='error'?'#991b1b':type==='loading'?'#1d4ed8':'#166534'}
function clearForm(){document.querySelectorAll('input,textarea').forEach(x=>x.value='');aiCV='';$('preview').style.display='none';$('status').style.display='none'}
</script>
</body>
</html>
