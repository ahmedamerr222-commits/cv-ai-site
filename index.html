<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="google-site-verification" content="Ya1VaciR5pdWYhgZMnAOUdOBp29fMfkgaMlRRwtTpa8">

<meta name="description" content="CV AI - أنشئ سيرة ذاتية احترافية مناسبة لتخصصك باستخدام الذكاء الاصطناعي.">
<meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV AI — السيرة الذاتية الاحترافية</title>

<style>

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fb;
color:#172033;
}

button,
input,
textarea{
font-family:inherit;
}

button{
border:0;
cursor:pointer;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
padding:16px 7%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:26px;
font-weight:900;
color:#3157d5;
}

.badge{
background:#eef2ff;
color:#3157d5;
padding:8px 13px;
border-radius:30px;
font-size:13px;
font-weight:bold;
}

.hero{
padding:55px 7%;
text-align:center;
background:linear-gradient(135deg,#eef2ff,#ffffff);
}

.hero h1{
margin:0 0 12px;
font-size:40px;
}

.hero p{
margin:0;
font-size:18px;
color:#667085;
}

.container{
max-width:1150px;
margin:35px auto;
padding:0 18px;
}

.section-title{
text-align:center;
margin-bottom:25px;
}

.section-title h2{
margin:0 0 8px;
font-size:28px;
}

.section-title p{
margin:0;
color:#667085;
}

.hidden{
display:none !important;
}

/* =========================
SPECIALTIES
========================= */

.specialties{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.specialty{
background:#fff;
border:2px solid #e5e7eb;
border-radius:22px;
padding:30px 22px;
text-align:center;
cursor:pointer;
transition:.25s;
box-shadow:0 10px 35px rgba(23,32,51,.06);
user-select:none;
}

.specialty:hover{
transform:translateY(-6px);
box-shadow:0 16px 40px rgba(23,32,51,.12);
}

.specialty:active{
transform:scale(.98);
}

.specialty.commerce:hover{
border-color:#2563eb;
}

.specialty.computers:hover{
border-color:#7c3aed;
}

.specialty.engineering:hover{
border-color:#059669;
}

.icon{
width:78px;
height:78px;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 18px;
font-size:38px;
}

.commerce .icon{
background:#eaf2ff;
}

.computers .icon{
background:#f2eaff;
}

.engineering .icon{
background:#e7f8f0;
}

.specialty h3{
font-size:22px;
margin:0 0 10px;
}

.specialty p{
margin:0;
color:#667085;
line-height:1.7;
}

/* =========================
TEMPLATES
========================= */

.templates{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.template-card{
background:#fff;
border:1px solid #e1e5ec;
border-radius:20px;
padding:15px;
box-shadow:0 10px 35px rgba(23,32,51,.07);
transition:.25s;
}

.template-card:hover{
transform:translateY(-5px);
box-shadow:0 16px 40px rgba(23,32,51,.12);
}

.template-card h3{
margin:15px 5px 6px;
font-size:19px;
}
